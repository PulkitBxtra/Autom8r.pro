<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Autom8r: automate the busywork, ship the real work.</title>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#fafaf8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.5">
      <stop offset="0" stop-color="#eaff3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#eaff3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#030303" stop-opacity="0"/>
      <stop offset="1" stop-color="#030303" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="600" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="600" fill="#030303"/>
    <rect width="1200" height="600" fill="url(#grid)"/>
    <ellipse cx="600" cy="0" rx="520" ry="230" fill="url(#glow)"/>
    <rect width="1200" height="600" fill="url(#fade)"/>

    <!-- Logo -->
    <g transform="translate(508 52)">
      <rect width="36" height="36" rx="9" fill="#eaff3c"/>
      <path d="M9 22.5L14.6 12.4L18.6 19.1L22.5 12.4L27 22.5" stroke="#030303" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="27" font-size="28" font-weight="900" letter-spacing="-0.6" fill="#fafaf8">Autom8r</text>
    </g>

    <!-- Pill -->
    <rect x="405" y="118" width="390" height="34" rx="17" fill="#1f1f1f" stroke="#3d3d3d"/>
    <g transform="translate(428 127) scale(0.67)" stroke="#eaff3c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
    </g>
    <text x="612" y="140" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#a3a39d">SELF-HOSTABLE WORKFLOW AUTOMATION</text>

    <!-- Headline -->
    <text x="600" y="236" text-anchor="middle" font-size="66" font-weight="900" letter-spacing="-2" fill="#fafaf8">Automate the busywork.</text>
    <text x="600" y="310" text-anchor="middle" font-size="66" font-weight="900" letter-spacing="-2" fill="#eaff3c">Ship the real work.</text>
    <text x="600" y="358" text-anchor="middle" font-size="19" fill="#a3a39d">Connect your apps, wire up a trigger, chain your actions.</text>

    <!-- Workflow card -->
    <rect x="190" y="400" width="820" height="136" rx="28" fill="#eaff3c" fill-opacity="0.07" filter="url(#cardGlow)"/>
    <rect x="150" y="396" width="900" height="144" rx="28" fill="#1f1f1f" stroke="#2c2c2c"/>

    <!-- Step 1: trigger -->
    <rect x="176" y="426" width="250" height="84" rx="18" fill="#171717" stroke="#3d3d3d"/>
    <rect x="194" y="446" width="44" height="44" rx="12" fill="#eaff3c"/>
    <g transform="translate(205 457) scale(0.9167)" stroke="#030303" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
      <path d="M9 18c-4.51 2-5-2-8-2"/>
    </g>
    <text x="252" y="464" font-size="15" font-weight="700" fill="#fafaf8">New Issue</text>
    <text x="252" y="485" font-size="13" fill="#a3a39d">GitHub</text>

    <g transform="translate(438 456) scale(1)" stroke="#6f6f68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </g>

    <!-- Step 2 -->
    <rect x="475" y="426" width="250" height="84" rx="18" fill="#171717" stroke="#3d3d3d"/>
    <rect x="493" y="446" width="44" height="44" rx="12" fill="#fafaf8" fill-opacity="0.1"/>
    <g transform="translate(504 457) scale(0.9167)" stroke="#fafaf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>
    </g>
    <text x="551" y="464" font-size="15" font-weight="700" fill="#fafaf8">Run Code</text>
    <text x="551" y="485" font-size="13" fill="#a3a39d">Groovy sandbox</text>

    <g transform="translate(737 456)" stroke="#6f6f68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </g>

    <!-- Step 3 -->
    <rect x="774" y="426" width="250" height="84" rx="18" fill="#171717" stroke="#3d3d3d"/>
    <rect x="792" y="446" width="44" height="44" rx="12" fill="#fafaf8" fill-opacity="0.1"/>
    <g transform="translate(803 457) scale(0.9167)" stroke="#fafaf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </g>
    <text x="850" y="464" font-size="15" font-weight="700" fill="#fafaf8">Post Message</text>
    <text x="850" y="485" font-size="13" fill="#a3a39d">Slack</text>
  </g>
</svg>
