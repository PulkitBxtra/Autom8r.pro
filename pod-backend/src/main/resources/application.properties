spring.application.name=pod-backend

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema owner: must boot before pod-webhooks / pod-workflow, which only validate.
# The schema comes from Flyway migrations (db/migration), which this pod runs for every pod
# sharing the database; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# A database built before migrations existed is marked as being at V1 instead of recreated.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# pod-connector, which registers active workflows' app triggers with the apps, and the shared
# secret it expects (same as its INTERNAL_API_TOKEN).
connector.base-url=${CONNECTOR_URL:http://localhost:8084}
internal.api-token=${INTERNAL_API_TOKEN:}
