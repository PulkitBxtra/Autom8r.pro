spring.application.name=pod-workflow


# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Kafka (Aiven hosted, SSL/mTLS via an SSL bundle)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-autm8r-autom8r.l.aivencloud.com:19593}
spring.kafka.security.protocol=SSL
spring.kafka.ssl.bundle=kafka

spring.ssl.bundle.pem.kafka.truststore.certificate=${KAFKA_CA_CERT_LOCATION:file:../kafka-certs/ca.pem}
spring.ssl.bundle.pem.kafka.keystore.certificate=${KAFKA_ACCESS_CERT_LOCATION:file:../kafka-certs/service.cert}
spring.ssl.bundle.pem.kafka.keystore.private-key=${KAFKA_ACCESS_KEY_LOCATION:file:../kafka-certs/service.key}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka (consumer)
spring.kafka.consumer.group-id=pod-workflow
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer