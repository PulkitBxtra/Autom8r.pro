spring.application.name=pod-workflow


# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema is owned by pod-backend (and pod-processor for step_run); this pod only checks its entity copies match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Kafka: Aiven over SSL/mTLS by default; KAFKA_SECURITY_PROTOCOL=PLAINTEXT for a plain broker
# (the compose stack's own). The certificate settings are in the kafka-SSL profile, so a
# plain-text broker needs no certificate files.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-autm8r-autom8r.l.aivencloud.com:19593}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SSL}
spring.profiles.include=kafka-${KAFKA_SECURITY_PROTOCOL:SSL}


spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
