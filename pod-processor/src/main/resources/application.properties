spring.application.name=pod-processor

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# The schema is pod-backend's Flyway migrations (pod-backend/src/main/resources/db/migration);
# this pod only checks that its entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082

# Kafka (Aiven hosted, SSL/mTLS via an SSL bundle)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-autm8r-autom8r.l.aivencloud.com:19593}
spring.kafka.security.protocol=SSL
spring.kafka.ssl.bundle=kafka

spring.ssl.bundle.pem.kafka.truststore.certificate=${KAFKA_CA_CERT_LOCATION:file:../kafka-certs/ca.pem}
spring.ssl.bundle.pem.kafka.keystore.certificate=${KAFKA_ACCESS_CERT_LOCATION:file:../kafka-certs/service.cert}
spring.ssl.bundle.pem.kafka.keystore.private-key=${KAFKA_ACCESS_KEY_LOCATION:file:../kafka-certs/service.key}

# Kafka (consumer)
spring.kafka.consumer.group-id=pod-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=MANUAL

# Kafka (producer) -- the orchestrator will publish step-tasks / step-results
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# pod-connector, for a step's connection credentials (POST /internal/connections/{id}/credentials),
# and the shared secret it expects. Must match pod-connector's INTERNAL_API_TOKEN.
connector.base-url=${CONNECTOR_URL:http://localhost:8084}
internal.api-token=${INTERNAL_API_TOKEN:}

# HTTP steps may only call public addresses. true lets them call localhost and private networks:
# for local development only, never where users other than you can create workflows.
http.allow-private-addresses=${HTTP_ALLOW_PRIVATE:false}

# App APIs used by the real handlers (overridable to point tests at a stand-in).
connectors.github.api-base=${CONNECTORS_GITHUB_APIBASE:https://api.github.com}
connectors.slack.api-base=${CONNECTORS_SLACK_APIBASE:https://slack.com/api}
connectors.notion.api-base=${CONNECTORS_NOTION_APIBASE:https://api.notion.com/v1}

# Code steps: the pod-sandbox jar each script runs in (a fresh JVM per run), and the OS sandbox
# around it: auto uses sandbox-exec on macOS; production runs the jar in a network-less container.
code.sandbox.jar=${SANDBOX_JAR:../pod-sandbox/target/pod-sandbox.jar}
code.sandbox.os-sandbox=${SANDBOX_OS:auto}
