spring.application.name=pod-processor

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# The schema is pod-backend's Flyway migrations (pod-backend/src/main/resources/db/migration);
# this pod only checks that its entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082

# Kafka: Aiven over SSL/mTLS by default; KAFKA_SECURITY_PROTOCOL=PLAINTEXT for a plain broker
# (the compose stack's own). The certificate settings are in the kafka-SSL profile, so a
# plain-text broker needs no certificate files.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-autm8r-autom8r.l.aivencloud.com:19593}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SSL}
spring.profiles.include=kafka-${KAFKA_SECURITY_PROTOCOL:SSL}


# Kafka (consumer)
spring.kafka.consumer.group-id=pod-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=MANUAL
# A crashed processor's partitions move to the others after 10s instead of Kafka's default 45s.
# Heartbeats run on their own thread, so a long step doesn't count against this (steps have
# max.poll.interval.ms; see StepTaskConsumer). Brokers usually allow 6s-30min.
spring.kafka.consumer.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT_MS:10000}
spring.kafka.consumer.heartbeat-interval=3s

# Kafka (producer) -- the orchestrator will publish step-tasks / step-results
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# How many steps run at once: step-tasks partitions, and one worker thread per partition (keep
# the two equal). The current Aiven plan allows 2 partitions per topic; after upgrading set both
# to 8 (STEPS_TOPIC_PARTITIONS / STEPS_WORKER_CONCURRENCY). Partitions can be added, never removed.
steps.topic-partitions=${STEPS_TOPIC_PARTITIONS:2}
steps.worker-concurrency=${STEPS_WORKER_CONCURRENCY:2}

# pod-connector, for a step's connection credentials (POST /internal/connections/{id}/credentials),
# and the shared secret it expects. Must match pod-connector's INTERNAL_API_TOKEN.
connector.base-url=${CONNECTOR_URL:http://localhost:8084}
internal.api-token=${INTERNAL_API_TOKEN:}

# HTTP steps may only call public addresses. true lets them call localhost and private networks:
# for local development only, never where users other than you can create workflows.
http.allow-private-addresses=${HTTP_ALLOW_PRIVATE:false}

# App APIs used by the real handlers (overridable to point tests at a stand-in).
connectors.github.api-base=${CONNECTORS_GITHUB_APIBASE:https://api.github.com}
connectors.slack.api-base=${CONNECTORS_SLACK_APIBASE:https://slack.com/api}
connectors.notion.api-base=${CONNECTORS_NOTION_APIBASE:https://api.notion.com/v1}
connectors.discord.api-base=${CONNECTORS_DISCORD_APIBASE:https://discord.com/api/v10}
connectors.trello.api-base=${CONNECTORS_TRELLO_APIBASE:https://api.trello.com/1}
connectors.trello.oauth-api-base=${CONNECTORS_TRELLO_OAUTHAPIBASE:https://trello.com/1}
connectors.stripe.api-base=${CONNECTORS_STRIPE_APIBASE:https://api.stripe.com/v1}
connectors.gmail.api-base=${CONNECTORS_GMAIL_APIBASE:https://gmail.googleapis.com/gmail/v1}
connectors.sheets.api-base=${CONNECTORS_SHEETS_APIBASE:https://sheets.googleapis.com/v4}

# Code steps run in pod-sandbox (a separate service with no network in production), and the
# token it expects (its SANDBOX_TOKEN).
code.sandbox.url=${SANDBOX_URL:http://localhost:8090}
code.sandbox.token=${SANDBOX_TOKEN:}
