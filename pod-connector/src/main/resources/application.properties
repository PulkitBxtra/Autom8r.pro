spring.application.name=pod-connector

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema owner for the connection tables (connection, oauth_state). Other pods never map them.
# The schema is pod-backend's Flyway migrations (pod-backend/src/main/resources/db/migration);
# this pod only checks that its entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8084

# Verifies login tokens issued by pod-backend, so it must be the same value as pod-backend's.
jwt.secret=${JWT_SECRET}

# Encrypts stored connection credentials. Base64 of 32 random bytes: `openssl rand -base64 32`.
# Only this pod holds it; losing it means every connection has to be reconnected.
connections.encryption-key=${CONNECTIONS_ENCRYPTION_KEY:}

# Where this pod and the UI are reachable from a browser. The OAuth callback is
# <public-url>/oauth/callback and must be registered with each provider exactly.
app.public-url=${CONNECTOR_PUBLIC_URL:http://localhost:8084}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# OAuth clients, from each provider's developer console. An app offers "Connect with ..." only
# once its provider's id and secret are set.
connectors.github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
connectors.github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
# admin:repo_hook: GitHub triggers register a repository webhook.
connectors.github.oauth.scopes=${GITHUB_OAUTH_SCOPES:read:user repo admin:repo_hook}
connectors.google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
connectors.google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
# A Notion public connection (notion.so/profile/integrations -> New connection -> Public), with
# redirect URI <public-url>/oauth/callback.
connectors.notion.oauth.client-id=${NOTION_OAUTH_CLIENT_ID:}
connectors.notion.oauth.client-secret=${NOTION_OAUTH_CLIENT_SECRET:}
# A Slack app (api.slack.com/apps), with redirect URL <public-url>/oauth/callback (Slack requires
# https) and the bot scopes in OAuthProviders.SLACK_SCOPES. Its signing secret (Basic Information)
# checks the events it sends to <triggers.public-url>/hooks/slack for Slack triggers; set that as
# its Event Subscriptions Request URL, with bot events message.channels and app_mention.
connectors.slack.oauth.client-id=${SLACK_OAUTH_CLIENT_ID:}
connectors.slack.oauth.client-secret=${SLACK_OAUTH_CLIENT_SECRET:}
connectors.slack.signing-secret=${SLACK_SIGNING_SECRET:}
# Locally the public URL is http://localhost, which Slack won't accept as a redirect: point
# Slack's sign-in back through the tunnel instead (https://<tunnel>/oauth/callback).
connectors.slack.oauth.callback-url=${SLACK_OAUTH_CALLBACK_URL:}

# Token refresh: every minute, refresh OAuth tokens expiring within 5 minutes. A token used
# on demand is refreshed if it expires within 1 minute (safety net if the job fell behind).
connections.refresh-interval-ms=${CONNECTIONS_REFRESH_INTERVAL_MS:60000}
connections.refresh-window-ms=${CONNECTIONS_REFRESH_WINDOW_MS:300000}
connections.refresh-margin-ms=60000

# Shared secret other pods (pod-processor) present to call /internal endpoints, e.g. to fetch a
# connection's credentials for a step. At least 16 characters; unset refuses all internal calls.
# Generate with `openssl rand -base64 32` and give pod-processor the same value.
internal.api-token=${INTERNAL_API_TOKEN:}

# App triggers (GitHub/Slack/Notion events that start workflows). The public HTTPS address apps
# can reach this pod at; hooks are <triggers.public-url>/hooks/<app>/... Locally, a tunnel:
# `cloudflared tunnel --url http://localhost:8084`. Unset: turning on an app-trigger workflow fails
# with a message saying so.
triggers.public-url=${TRIGGERS_PUBLIC_URL:}
# pod-webhooks, which records runs.
webhooks.base-url=${WEBHOOKS_URL:http://localhost:8080}
